name: Build Release Bundles

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Loctree suite version to bundle (for example 0.10.0)"
        required: true
        type: string
      aicx_version:
        description: "AICX release version to include"
        required: false
        default: "0.7.3"
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LOCT_IO_ROOT: ${{ github.workspace }}/loct-io

jobs:
  verify:
    name: Verify Bundle Input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      aicx_version: ${{ steps.meta.outputs.aicx_version }}
    steps:
      - name: Checkout loctree-suite
        # actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Resolve versions
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_AICX_VERSION: ${{ inputs.aicx_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          AICX_VERSION="${INPUT_AICX_VERSION:-0.7.3}"

          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "version must look like x.y.z" >&2
            exit 1
          fi
          if [[ ! "$AICX_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "aicx_version must look like x.y.z" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "aicx_version=$AICX_VERSION" >> "$GITHUB_OUTPUT"
          echo "Loctree bundle version: $VERSION"
          echo "AICX included version: $AICX_VERSION"

      - name: Check Cargo workspace version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          WORKSPACE_VERSION=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as fh:
              print(tomllib.load(fh)["workspace"]["package"]["version"])
          PY
          )
          if [[ "$WORKSPACE_VERSION" != "$VERSION" ]]; then
            echo "Cargo workspace version $WORKSPACE_VERSION does not match $VERSION" >&2
            exit 1
          fi

      - name: Check AICX release assets are addressable
        env:
          AICX_VERSION: ${{ steps.meta.outputs.aicx_version }}
        run: |
          set -euo pipefail
          base_url="https://github.com/Loctree/aicx/releases/download/v${AICX_VERSION}"
          assets=(
            "aicx-v${AICX_VERSION}-aarch64-apple-darwin-slim-unsigned.tar.gz"
            "aicx-v${AICX_VERSION}-x86_64-unknown-linux-gnu-slim-unsigned.tar.gz"
          )
          for asset in "${assets[@]}"; do
            curl -fsLI "${base_url}/${asset}" >/dev/null
            curl -fsLI "${base_url}/${asset}.sha256" >/dev/null
          done

  build:
    name: Build ${{ matrix.target }} Bundle
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            bundle_flavor: full
            artifact_suffix: ""
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            bundle_flavor: full
            artifact_suffix: ""
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            bundle_flavor: core
            artifact_suffix: "-core"
    steps:
      - name: Checkout loctree-suite
        # actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Rust
        # dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          NEED_APT=0
          command -v protoc >/dev/null 2>&1 || NEED_APT=1
          if [[ "$NEED_APT" -eq 1 ]]; then
            sudo apt-get update
            APT_PKGS=()
            command -v protoc >/dev/null 2>&1 || APT_PKGS+=(protobuf-compiler)
            sudo apt-get install -y "${APT_PKGS[@]}"
          fi
          # Linux gnu uses cargo-zigbuild for the glibc floor; Linux musl uses
          # cargo-zigbuild for a static target without repo-local linker config.
          if [[ "${TARGET}" == *-linux-gnu || "${TARGET}" == *-linux-musl ]]; then
            command -v cargo-zigbuild >/dev/null 2>&1 || cargo install --locked cargo-zigbuild
            # pip install of ziglang dies on PEP 668 (externally-managed env) on
            # ops-linux — install a pinned official zig tarball instead.
            if ! command -v zig >/dev/null 2>&1 && ! python3 -m ziglang version >/dev/null 2>&1; then
              ZIG_VERSION=0.16.0
              ZIG_SHA256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
              curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" \
                "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
              echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
              mkdir -p "$RUNNER_TEMP/zig"
              tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
              echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
            fi
          fi

      - name: Import macOS signing certificate if provided
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12_BASE64:-}" ]]; then
            echo "No MACOS_CERT_P12_BASE64 secret; using runner keychain identities."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/loctree-bundle.keychain-db"
          CERT_PATH="$RUNNER_TEMP/loctree-bundle-cert.p12"
          CA_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$CA_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$CA_PATH" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" /Library/Keychains/System.keychain /System/Library/Keychains/SystemRootCertificates.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Build release bundle
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          AICX_VERSION: ${{ needs.verify.outputs.aicx_version }}
          TARGET: ${{ matrix.target }}
          BUNDLE_FLAVOR: ${{ matrix.bundle_flavor }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          LOCTREE_GPG_KEY_ID: ${{ secrets.LOCTREE_GPG_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_args=(
            --aicx-version "$AICX_VERSION" \
            --target "$TARGET" \
            --bundle-flavor "$BUNDLE_FLAVOR" \
            --loct-io-root "$LOCT_IO_ROOT" \
            --no-sync
          )
          if [[ "$TARGET" == *apple-darwin && -z "${MACOS_DEVELOPER_ID_APPLICATION:-}" ]]; then
            bundle_args+=(--allow-unsigned-macos)
          fi
          bash distribution/build-bundle.sh "$VERSION" "${bundle_args[@]}"

      - name: Verify release bundle contents
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          BUNDLE_FLAVOR: ${{ matrix.bundle_flavor }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          bundle="dist/release-bundles/${VERSION}/loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}.tar.gz"
          root="loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}"
          tar -tzf "$bundle" > "$RUNNER_TEMP/bundle-files.txt"
          # loctree-suite native binaries are mandatory on every target.
          REQUIRED=(
            "$root/bin/loct"
            "$root/bin/loctree"
            "$root/bin/loctree-mcp"
            "$root/bin/loctree-lsp"
            "$root/components.json"
            "$root/CHECKSUMS.sha256"
            "$root/README.md"
          )
          if [[ "$BUNDLE_FLAVOR" == "full" ]]; then
            REQUIRED+=("$root/bin/aicx" "$root/bin/aicx-mcp")
          else
            REQUIRED+=("$root/components/loctree-aicx.json")
            FORBIDDEN=("$root/bin/aicx" "$root/bin/aicx-mcp")
            for path in "${FORBIDDEN[@]}"; do
              if grep -Fx "$path" "$RUNNER_TEMP/bundle-files.txt" >/dev/null; then
                echo "core bundle must not include $path" >&2
                exit 1
              fi
            done
          fi
          for path in "${REQUIRED[@]}"; do
            grep -Fx "$path" "$RUNNER_TEMP/bundle-files.txt" >/dev/null
          done
          verify_dir="$RUNNER_TEMP/bundle-verify"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          VERIFY_PATHS=("$root/components.json" "$root/README.md")
          if [[ "$BUNDLE_FLAVOR" == "core" ]]; then
            VERIFY_PATHS+=("$root/components/loctree-aicx.json")
          fi
          tar -xzf "$bundle" -C "$verify_dir" "${VERIFY_PATHS[@]}"
          if [[ "$BUNDLE_FLAVOR" == "core" ]]; then
            grep -F '"bundled": false' "$verify_dir/$root/components.json" >/dev/null
            grep -F 'AICX is not bundled in this core artifact' "$verify_dir/$root/README.md" >/dev/null
            grep -F '"bundle_flavor": "core"' "$verify_dir/$root/components/loctree-aicx.json" >/dev/null
            grep -F '"optional_runtime_dependency": true' "$verify_dir/$root/components/loctree-aicx.json" >/dev/null
          fi

      - name: Smoke Linux glibc portability
        if: runner.os == 'Linux' && endsWith(matrix.target, '-linux-gnu')
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          bundle="dist/release-bundles/${VERSION}/loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}.tar.gz"
          root="loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}"
          extract_dir="$RUNNER_TEMP/linux-glibc-smoke"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$bundle" -C "$extract_dir"
          make smoke-release-linux-gnu SMOKE_BIN_DIR="$extract_dir/$root/bin"

      - name: Smoke Linux musl on Debian 12
        if: runner.os == 'Linux' && endsWith(matrix.target, '-linux-musl')
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || {
            echo "docker is required for Debian 12 musl smoke" >&2
            exit 1
          }
          bundle="dist/release-bundles/${VERSION}/loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}.tar.gz"
          root="loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}"
          extract_dir="$RUNNER_TEMP/linux-musl-smoke"
          fixture_dir="$RUNNER_TEMP/linux-musl-fixture"
          rm -rf "$extract_dir" "$fixture_dir"
          mkdir -p "$extract_dir" "$fixture_dir"
          printf 'fn main() { println!("debian musl smoke"); }\n' > "$fixture_dir/main.rs"
          tar -xzf "$bundle" -C "$extract_dir"
          file "$extract_dir/$root/bin/loct"
          { ldd "$extract_dir/$root/bin/loct" 2>&1 || true; } | tee "$RUNNER_TEMP/linux-musl-ldd.txt"
          if ! grep -E 'not a dynamic executable|statically linked' "$RUNNER_TEMP/linux-musl-ldd.txt" >/dev/null; then
            echo "loct is not reported as static by ldd" >&2
            exit 1
          fi
          docker run --rm \
            -v "$extract_dir/$root:/bundle:ro" \
            -v "$fixture_dir:/fixture:ro" \
            debian:12 \
            /bin/bash -lc '/bundle/bin/loct --version && /bundle/bin/loct scan /fixture'

      - name: Upload release bundle artifacts
        # actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loctree-${{ needs.verify.outputs.version }}-${{ matrix.target }}${{ matrix.artifact_suffix }}
          path: |
            dist/release-bundles/${{ needs.verify.outputs.version }}/loctree-${{ needs.verify.outputs.version }}-${{ matrix.target }}${{ matrix.artifact_suffix }}.tar.gz
            dist/release-bundles/${{ needs.verify.outputs.version }}/loctree-${{ needs.verify.outputs.version }}-${{ matrix.target }}${{ matrix.artifact_suffix }}.tar.gz.sha256
            dist/release-bundles/${{ needs.verify.outputs.version }}/loctree-${{ needs.verify.outputs.version }}-${{ matrix.target }}${{ matrix.artifact_suffix }}.tar.gz.sig
          if-no-files-found: ignore
