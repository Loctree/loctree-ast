name: Build Release Bundles

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Loctree suite version to bundle (for example 0.10.0)"
        required: true
        type: string
      aicx_version:
        description: "AICX release version to include"
        required: false
        default: "0.12.5"
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LOCT_IO_ROOT: ${{ github.workspace }}/loct-io

jobs:
  verify:
    name: Verify Bundle Input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      aicx_version: ${{ steps.meta.outputs.aicx_version }}
    steps:
      - name: Checkout loctree-suite
        # actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # A manual recovery run executes the workflow definition from main,
          # but builds the immutable release tag named by the input.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Resolve versions
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_AICX_VERSION: ${{ inputs.aicx_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          AICX_VERSION="${INPUT_AICX_VERSION:-0.12.5}"

          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "version must look like x.y.z" >&2
            exit 1
          fi
          if [[ ! "$AICX_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "aicx_version must look like x.y.z" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "aicx_version=$AICX_VERSION" >> "$GITHUB_OUTPUT"
          echo "Loctree bundle version: $VERSION"
          echo "AICX included version: $AICX_VERSION"

      - name: Check Cargo workspace version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          WORKSPACE_VERSION=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as fh:
              print(tomllib.load(fh)["workspace"]["package"]["version"])
          PY
          )
          if [[ "$WORKSPACE_VERSION" != "$VERSION" ]]; then
            echo "Cargo workspace version $WORKSPACE_VERSION does not match $VERSION" >&2
            exit 1
          fi

      - name: Test release bundle contracts
        run: |
          set -euo pipefail
          node distribution/tests/npm_wrapper_test.js
          bash distribution/tests/windows_bundle_test.sh

      - name: Check AICX release assets are addressable
        env:
          AICX_VERSION: ${{ steps.meta.outputs.aicx_version }}
        run: |
          set -euo pipefail
          base_url="https://github.com/Loctree/aicx/releases/download/v${AICX_VERSION}"
          targets=(
            aarch64-apple-darwin
            x86_64-unknown-linux-gnu
            x86_64-pc-windows-msvc
          )
          for target in "${targets[@]}"; do
            asset=$(bash distribution/build-bundle.sh "$AICX_VERSION" \
              --aicx-version "$AICX_VERSION" \
              --no-sync \
              --dry-run \
              --print-aicx-asset "$target")
            echo "checking $asset"
            curl -fsLI "${base_url}/${asset}" >/dev/null
            curl -fsLI "${base_url}/${asset}.sha256" >/dev/null
          done

  build:
    name: Build ${{ matrix.target }} Bundle
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # `lsp_asset` is the raw per-platform loctree-lsp asset name the shipped
      # editor plugins resolve from Loctree/loctree-release. The strings are a
      # published contract, not a convention — see
      # editors/jetbrains/.../binary/PlatformAsset.kt assetName() and
      # .github/workflows/vscode-extension.yml. Empty = no plugin consumes this
      # target (musl).
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            bundle_flavor: full
            artifact_suffix: ""
            lsp_asset: loctree-lsp-darwin-arm64
          # AICX publishes no x86_64-apple-darwin release asset, so this bundle
          # can only be core — but the VS Code packaging script hard-codes the
          # plain archive name loctree-<ver>-x86_64-apple-darwin.tar.gz and
          # v0.13.1 shipped it under exactly that name. --bundle-suffix "" keeps
          # the published contract; the bundle's own README.md and
          # components.json still declare AICX unbundled, and the verify step
          # below asserts they do.
          - target: x86_64-apple-darwin
            runner: macos-latest
            bundle_flavor: core
            artifact_suffix: ""
            lsp_asset: loctree-lsp-darwin-x64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            bundle_flavor: full
            artifact_suffix: ""
            lsp_asset: loctree-lsp-linux-x64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            bundle_flavor: core
            artifact_suffix: "-core"
            lsp_asset: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            bundle_flavor: full
            artifact_suffix: ""
            lsp_asset: loctree-lsp-windows-x64.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout loctree-suite
        # actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Setup Rust
        # dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Normalize runner temp for bash tools
        run: |
          set -euo pipefail
          bash_runner_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            command -v cygpath >/dev/null 2>&1
            bash_runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          fi
          printf 'BASH_RUNNER_TEMP=%s\n' "$bash_runner_temp" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          NEED_APT=0
          command -v protoc >/dev/null 2>&1 || NEED_APT=1
          if [[ "$NEED_APT" -eq 1 ]]; then
            sudo apt-get update
            APT_PKGS=()
            command -v protoc >/dev/null 2>&1 || APT_PKGS+=(protobuf-compiler)
            sudo apt-get install -y "${APT_PKGS[@]}"
          fi
          # Linux gnu uses cargo-zigbuild for the glibc floor; Linux musl uses
          # cargo-zigbuild for a static target without repo-local linker config.
          if [[ "${TARGET}" == *-linux-gnu || "${TARGET}" == *-linux-musl ]]; then
            command -v cargo-zigbuild >/dev/null 2>&1 || cargo install --locked cargo-zigbuild
            # pip install of ziglang dies on PEP 668 (externally-managed env) on
            # managed Linux runners — install a pinned official zig tarball instead.
            if ! command -v zig >/dev/null 2>&1 && ! python3 -m ziglang version >/dev/null 2>&1; then
              ZIG_VERSION=0.16.0
              ZIG_SHA256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
              curl -fsSL -o "$BASH_RUNNER_TEMP/zig.tar.xz" \
                "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
              echo "${ZIG_SHA256}  $BASH_RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
              mkdir -p "$BASH_RUNNER_TEMP/zig"
              tar -xJf "$BASH_RUNNER_TEMP/zig.tar.xz" -C "$BASH_RUNNER_TEMP/zig" --strip-components=1
              echo "$BASH_RUNNER_TEMP/zig" >> "$GITHUB_PATH"
            fi
          fi

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            choco install protoc --yes --no-progress
          }
          protoc --version

      - name: Import macOS signing certificate if provided
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12_BASE64:-}" ]]; then
            echo "No MACOS_CERT_P12_BASE64 secret; using runner keychain identities."
            exit 0
          fi

          KEYCHAIN="$BASH_RUNNER_TEMP/loctree-bundle.keychain-db"
          CERT_PATH="$BASH_RUNNER_TEMP/loctree-bundle-cert.p12"
          CA_PATH="$BASH_RUNNER_TEMP/DeveloperIDG2CA.cer"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$CA_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$CA_PATH" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" /Library/Keychains/System.keychain /System/Library/Keychains/SystemRootCertificates.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Build release bundle
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          AICX_VERSION: ${{ needs.verify.outputs.aicx_version }}
          TARGET: ${{ matrix.target }}
          BUNDLE_FLAVOR: ${{ matrix.bundle_flavor }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          LOCTREE_GPG_KEY_ID: ${{ secrets.LOCTREE_GPG_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # artifact_suffix is the single source of truth for the published
          # artifact name; --bundle-suffix makes build-bundle.sh agree with it
          # instead of deriving a second, divergent name from the flavor.
          bundle_args=(
            --aicx-version "$AICX_VERSION" \
            --target "$TARGET" \
            --bundle-flavor "$BUNDLE_FLAVOR" \
            --bundle-suffix "$ARTIFACT_SUFFIX" \
            --loct-io-root "$LOCT_IO_ROOT" \
            --no-sync
          )
          if [[ "$TARGET" == *apple-darwin && -z "${MACOS_DEVELOPER_ID_APPLICATION:-}" ]]; then
            bundle_args+=(--allow-unsigned-macos)
          fi
          bash distribution/build-bundle.sh "$VERSION" "${bundle_args[@]}"

      - name: Verify release bundle contents
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          BUNDLE_FLAVOR: ${{ matrix.bundle_flavor }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          bundle="dist/release-bundles/${VERSION}/loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}.tar.gz"
          root="loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}"
          suffix=""
          if [[ "$TARGET" == *-windows-* ]]; then
            suffix=".exe"
          fi
          tar -tzf "$bundle" > "$BASH_RUNNER_TEMP/bundle-files.txt"
          # loctree-suite native binaries are mandatory on every target.
          REQUIRED=(
            "$root/bin/loct${suffix}"
            "$root/bin/loctree${suffix}"
            "$root/bin/loctree-mcp${suffix}"
            "$root/bin/loctree-lsp${suffix}"
            "$root/components.json"
            "$root/CHECKSUMS.sha256"
            "$root/README.md"
          )
          if [[ "$BUNDLE_FLAVOR" == "full" ]]; then
            REQUIRED+=("$root/bin/aicx${suffix}" "$root/bin/aicx-mcp${suffix}")
          else
            REQUIRED+=("$root/components/loctree-aicx.json")
            FORBIDDEN=("$root/bin/aicx" "$root/bin/aicx-mcp")
            for path in "${FORBIDDEN[@]}"; do
              if grep -Fx "$path" "$BASH_RUNNER_TEMP/bundle-files.txt" >/dev/null; then
                echo "core bundle must not include $path" >&2
                exit 1
              fi
            done
          fi
          for path in "${REQUIRED[@]}"; do
            grep -Fx "$path" "$BASH_RUNNER_TEMP/bundle-files.txt" >/dev/null
          done
          verify_dir="$BASH_RUNNER_TEMP/bundle-verify"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          VERIFY_PATHS=("$root/components.json" "$root/README.md")
          if [[ "$BUNDLE_FLAVOR" == "core" ]]; then
            VERIFY_PATHS+=("$root/components/loctree-aicx.json")
          fi
          tar -xzf "$bundle" -C "$verify_dir" "${VERIFY_PATHS[@]}"
          if [[ "$BUNDLE_FLAVOR" == "core" ]]; then
            grep -F '"bundled": false' "$verify_dir/$root/components.json" >/dev/null
            grep -F 'AICX is not bundled in this core artifact' "$verify_dir/$root/README.md" >/dev/null
            grep -F '"bundle_flavor": "core"' "$verify_dir/$root/components/loctree-aicx.json" >/dev/null
            grep -F '"optional_runtime_dependency": true' "$verify_dir/$root/components/loctree-aicx.json" >/dev/null
          fi

      - name: Smoke all bundled versions and scan a committed fixture
        if: matrix.bundle_flavor == 'full'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          bundle="dist/release-bundles/${VERSION}/loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}.tar.gz"
          root="loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}"
          extract_dir="$BASH_RUNNER_TEMP/version-smoke"
          suffix=""
          if [[ "$TARGET" == *-windows-* ]]; then
            suffix=".exe"
          fi
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$bundle" -C "$extract_dir"
          for bin in loct loctree loctree-mcp loctree-lsp aicx aicx-mcp; do
            "$extract_dir/$root/bin/${bin}${suffix}" --version
          done
          "$extract_dir/$root/bin/loct${suffix}" scan \
            "$PWD/distribution/tests/fixtures/release-smoke"

      # Raw per-platform loctree-lsp asset for the JetBrains verified-download
      # path. It is EXTRACTED from the bundle that was just built, verified and
      # signed — not rebuilt — so the binary JetBrains downloads is byte-identical
      # to the one the VS Code VSIX unpacks from the same archive. Same-version
      # is then a property of the artifact, not of a second build.
      - name: Stage per-platform loctree-lsp asset
        if: matrix.lsp_asset != ''
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
          LSP_ASSET: ${{ matrix.lsp_asset }}
        shell: bash
        run: |
          set -euo pipefail
          dist="dist/release-bundles/${VERSION}"
          root="loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}"
          bundle="${dist}/${root}.tar.gz"
          work="$BASH_RUNNER_TEMP/lsp-asset"
          rm -rf "$work"
          mkdir -p "$work"
          suffix=""
          if [[ "$TARGET" == *-windows-* ]]; then
            suffix=".exe"
          fi
          tar -xzf "$bundle" -C "$work" "$root/bin/loctree-lsp${suffix}"
          install -m 0755 "$work/$root/bin/loctree-lsp${suffix}" "${dist}/${LSP_ASSET}"
          # Sidecar shape is "<sha256>  <name>". Every consumer reads whitespace
          # field 1 of the first line: fetch-release-lsp.js expectedSha(),
          # client.ts expectedShaFromSidecar(), JetBrains CachedBinaryVerifier
          # via PlatformAsset.checksumAssetName().
          if command -v shasum >/dev/null 2>&1; then
            (cd "$dist" && shasum -a 256 "$LSP_ASSET" > "${LSP_ASSET}.sha256")
          else
            (cd "$dist" && sha256sum "$LSP_ASSET" > "${LSP_ASSET}.sha256")
          fi
          test -s "${dist}/${LSP_ASSET}"
          test -s "${dist}/${LSP_ASSET}.sha256"
          cat "${dist}/${LSP_ASSET}.sha256"

      - name: Smoke Linux glibc portability
        if: runner.os == 'Linux' && endsWith(matrix.target, '-linux-gnu')
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          bundle="dist/release-bundles/${VERSION}/loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}.tar.gz"
          root="loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}"
          extract_dir="$BASH_RUNNER_TEMP/linux-glibc-smoke"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$bundle" -C "$extract_dir"
          make smoke-release-linux-gnu SMOKE_BIN_DIR="$extract_dir/$root/bin"

      - name: Smoke Linux musl on Debian 12
        if: runner.os == 'Linux' && endsWith(matrix.target, '-linux-musl')
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || {
            echo "docker is required for Debian 12 musl smoke" >&2
            exit 1
          }
          bundle="dist/release-bundles/${VERSION}/loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}.tar.gz"
          root="loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}"
          extract_dir="$BASH_RUNNER_TEMP/linux-musl-smoke"
          fixture_dir="$BASH_RUNNER_TEMP/linux-musl-fixture"
          rm -rf "$extract_dir" "$fixture_dir"
          mkdir -p "$extract_dir" "$fixture_dir"
          printf 'fn main() { println!("debian musl smoke"); }\n' > "$fixture_dir/main.rs"
          git -C "$fixture_dir" init -q
          git -C "$fixture_dir" add main.rs
          git -C "$fixture_dir" \
            -c user.name=smoke \
            -c user.email=smoke@loct.io \
            commit -qm fixture
          tar -xzf "$bundle" -C "$extract_dir"
          file "$extract_dir/$root/bin/loct"
          { ldd "$extract_dir/$root/bin/loct" 2>&1 || true; } | tee "$BASH_RUNNER_TEMP/linux-musl-ldd.txt"
          if ! grep -E 'not a dynamic executable|statically linked' "$BASH_RUNNER_TEMP/linux-musl-ldd.txt" >/dev/null; then
            echo "loct is not reported as static by ldd" >&2
            exit 1
          fi
          docker run --rm \
            -v "$extract_dir/$root:/bundle:ro" \
            -v "$fixture_dir:/fixture:ro" \
            debian:12 \
            /bin/bash -lc '/bundle/bin/loct --version && /bundle/bin/loct scan /fixture'

      - name: Smoke macOS dylib portability
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          bundle="dist/release-bundles/${VERSION}/loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}.tar.gz"
          root="loctree-${VERSION}-${TARGET}${ARTIFACT_SUFFIX}"
          extract_dir="$BASH_RUNNER_TEMP/macos-dylib-smoke"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$bundle" -C "$extract_dir"
          bins=()
          for b in loct loctree loctree-mcp loctree-lsp aicx aicx-mcp; do
            if [[ -x "$extract_dir/$root/bin/$b" ]]; then
              bins+=("$extract_dir/$root/bin/$b")
            fi
          done
          if [[ ${#bins[@]} -eq 0 ]]; then
            echo "no staged binaries to smoke in $extract_dir/$root/bin" >&2
            exit 1
          fi
          bash distribution/macos/smoke-releaseability.sh "${bins[@]}"

      - name: Upload release bundle artifacts
        # actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loctree-${{ needs.verify.outputs.version }}-${{ matrix.target }}${{ matrix.artifact_suffix }}
          path: |
            dist/release-bundles/${{ needs.verify.outputs.version }}/loctree-${{ needs.verify.outputs.version }}-${{ matrix.target }}${{ matrix.artifact_suffix }}.tar.gz
            dist/release-bundles/${{ needs.verify.outputs.version }}/loctree-${{ needs.verify.outputs.version }}-${{ matrix.target }}${{ matrix.artifact_suffix }}.tar.gz.sha256
            dist/release-bundles/${{ needs.verify.outputs.version }}/loctree-${{ needs.verify.outputs.version }}-${{ matrix.target }}${{ matrix.artifact_suffix }}.tar.gz.sig
          if-no-files-found: ignore

      - name: Upload per-platform loctree-lsp asset
        if: matrix.lsp_asset != ''
        # actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loctree-lsp-asset-${{ matrix.target }}
          path: |
            dist/release-bundles/${{ needs.verify.outputs.version }}/${{ matrix.lsp_asset }}
            dist/release-bundles/${{ needs.verify.outputs.version }}/${{ matrix.lsp_asset }}.sha256
          # Fail-closed: a missing plugin runtime asset must stop the release,
          # not produce a quietly incomplete one.
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Close the artifact chain.
  #
  # Until 0.14.2 this workflow ended at actions/upload-artifact: the bundles
  # existed for 90 days inside a private Actions run and nowhere else. Both
  # shipped editor plugins resolve their loctree-lsp runtime from
  # Loctree/loctree-release (editors/vscode/scripts/fetch-release-lsp.js,
  # editors/vscode/src/client.ts, editors/jetbrains/.../PlatformAsset.kt), whose
  # newest release was v0.13.1 — so VS Code and JetBrains packaging for any
  # newer version could not succeed. This job publishes the release the plugins
  # actually read.
  #
  # Cross-repo write uses HOMEBREW_GITHUB_API_TOKEN, the token this repo already
  # holds for cross-repo release and tap writes (docs/release/README.md §5,
  # publish.yml, homebrew-release.yml). No new secret is introduced; if the
  # token is absent the job fails loudly rather than skipping.
  #
  # Re-runnable, never destructive: an asset already on the release is compared
  # by sha256. Identical bytes are a no-op; different bytes are a hard failure.
  # Overwriting a published, verified asset is never done implicitly — npm-style
  # immutability, because the plugins pin exact tags and users cache by sha256.
  # ---------------------------------------------------------------------------
  publish-loctree-release:
    name: Publish to Loctree/loctree-release
    needs:
      - verify
      - build
    # Only a real version tag publishes. workflow_dispatch stays a build-only
    # rehearsal: same artifacts, no public repo touched.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_REPO: Loctree/loctree-release
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
      ASSET_DIR: ${{ github.workspace }}/release-assets
    steps:
      - name: Require the cross-repo release token
        env:
          RELEASE_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_GITHUB_API_TOKEN is not set on this repository."
            echo "::error::It is the cross-repo token used to write releases outside loctree-suite."
            echo "::error::Add it with 'contents: write' on ${RELEASE_REPO} and re-run this job."
            echo "::error::Refusing to finish the tag build without publishing the plugin runtime assets."
            exit 1
          fi

      - name: Download bundle artifacts
        # actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ env.ASSET_DIR }}
          merge-multiple: true

      - name: Assert the published asset contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$ASSET_DIR"

          # Combined bundles. fetch-release-lsp.js builds this exact name from
          # `loctree-${version}-${target}.tar.gz` and extracts
          # `loctree-${version}-${target}/bin/loctree-lsp`; client.ts's
          # archiveAssetName()/archiveRootDir() agree byte-for-byte.
          ARCHIVES=(
            "loctree-${VERSION}-aarch64-apple-darwin.tar.gz"
            "loctree-${VERSION}-x86_64-apple-darwin.tar.gz"
            "loctree-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "loctree-${VERSION}-x86_64-unknown-linux-musl-core.tar.gz"
            "loctree-${VERSION}-x86_64-pc-windows-msvc.tar.gz"
          )
          # Raw per-platform runtimes. These are PlatformAsset.assetName()'s
          # return values, and the lsp_asset column of vscode-extension.yml.
          LSP_ASSETS=(
            loctree-lsp-darwin-arm64
            loctree-lsp-darwin-x64
            loctree-lsp-linux-x64
            loctree-lsp-windows-x64.exe
          )

          missing=0
          for asset in "${ARCHIVES[@]}" "${LSP_ASSETS[@]}"; do
            for path in "$asset" "$asset.sha256"; do
              if [[ ! -s "$path" ]]; then
                echo "::error::missing or empty release asset: $path"
                missing=1
              fi
            done
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Refusing to publish an incomplete ${TAG} release."
            exit 1
          fi

          # The archive contract is the path the plugins extract, not just the
          # file name. Assert it rather than trusting the bundle build.
          for asset in "${ARCHIVES[@]}"; do
            root="${asset%.tar.gz}"
            member="$root/bin/loctree-lsp"
            if [[ "$asset" == *-windows-msvc.tar.gz ]]; then
              member="${member}.exe"
            fi
            # Do not pipe a full tar listing into grep -q under pipefail: grep
            # exits at the match and tar then dies on SIGPIPE, producing a
            # false "missing member" result for a valid archive.
            if ! tar -tzf "$asset" "$member" >/dev/null; then
              echo "::error::$asset does not contain $member"
              exit 1
            fi
          done

          # Every sidecar must actually describe its asset.
          for asset in "${ARCHIVES[@]}" "${LSP_ASSETS[@]}"; do
            expected="$(awk '{print $1; exit}' "$asset.sha256")"
            actual="$(sha256sum "$asset" | awk '{print $1}')"
            if [[ "$expected" != "$actual" ]]; then
              echo "::error::sha256 sidecar mismatch for $asset: sidecar=$expected actual=$actual"
              exit 1
            fi
          done

          # The raw loctree-lsp assets must be the very binaries inside the
          # matching archives. Same-version is worth little if the two delivery
          # paths can drift.
          declare -A PAIRS=(
            [loctree-lsp-darwin-arm64]="loctree-${VERSION}-aarch64-apple-darwin"
            [loctree-lsp-darwin-x64]="loctree-${VERSION}-x86_64-apple-darwin"
            [loctree-lsp-linux-x64]="loctree-${VERSION}-x86_64-unknown-linux-gnu"
            [loctree-lsp-windows-x64.exe]="loctree-${VERSION}-x86_64-pc-windows-msvc"
          )
          work="$RUNNER_TEMP/archive-lsp"
          for raw in "${!PAIRS[@]}"; do
            root="${PAIRS[$raw]}"
            rm -rf "$work"
            mkdir -p "$work"
            member="$root/bin/loctree-lsp"
            if [[ "$raw" == *.exe ]]; then
              member="${member}.exe"
            fi
            tar -xzf "$root.tar.gz" -C "$work" "$member"
            a="$(sha256sum "$raw" | awk '{print $1}')"
            b="$(sha256sum "$work/$member" | awk '{print $1}')"
            if [[ "$a" != "$b" ]]; then
              echo "::error::$raw differs from $root/bin/loctree-lsp ($a != $b)"
              exit 1
            fi
            echo "ok: $raw == $root/bin/loctree-lsp ($a)"
          done

          # SHA256SUMS over everything published. v0.13.1's SHA256SUMS carried
          # bare file names and no digests, which made it unverifiable; this one
          # is real `sha256sum -c` input.
          rm -f SHA256SUMS
          sha256sum "${ARCHIVES[@]}" "${LSP_ASSETS[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Create or reuse the loctree-release draft
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists on $RELEASE_REPO; reusing it"
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Loctree $VERSION release artifacts.

          Combined Loctree + AICX suite bundles for macOS arm64, Linux GNU and Windows
          x64, core bundles for macOS x64 and Linux musl, plus the raw per-platform
          loctree-lsp binaries consumed by the VS Code and JetBrains plugins.

          Verify with 'sha256sum -c SHA256SUMS' or the per-asset '.sha256' sidecars.

          Built from $GITHUB_REPOSITORY $TAG ($COMMIT_SHA) by release-bundles.yml.
          EOF
          # No --target: the tag does not exist in the release repo, so GitHub
          # creates it on that repo's default branch. Draft first so consumers
          # never observe a half-populated release.
          gh release create "$TAG" \
            --repo "$RELEASE_REPO" \
            --draft \
            --title "loctree $VERSION" \
            --notes-file "$notes"

      - name: Upload assets without overwriting verified bytes
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ASSET_DIR"

          existing="$RUNNER_TEMP/existing.txt"
          gh release view "$TAG" --repo "$RELEASE_REPO" --json assets \
            --jq '.assets[].name' > "$existing"

          remote_dir="$RUNNER_TEMP/remote-asset"
          uploaded=0
          skipped=0

          # Everything staged here is published, including the .sig sidecars,
          # which exist only when LOCTREE_GPG_KEY_ID is configured. They are
          # published when present and never required.
          for asset in *; do
            [[ -f "$asset" ]] || continue
            if grep -Fxq "$asset" "$existing"; then
              rm -rf "$remote_dir"
              mkdir -p "$remote_dir"
              gh release download "$TAG" --repo "$RELEASE_REPO" \
                --pattern "$asset" --dir "$remote_dir"
              local_sha="$(sha256sum "$asset" | awk '{print $1}')"
              remote_sha="$(sha256sum "$remote_dir/$asset" | awk '{print $1}')"
              if [[ "$local_sha" == "$remote_sha" ]]; then
                echo "skip (identical): $asset"
                skipped=$((skipped + 1))
                continue
              fi
              echo "::error::$TAG on $RELEASE_REPO already carries a DIFFERENT $asset."
              echo "::error::  published: $remote_sha"
              echo "::error::  this build: $local_sha"
              echo "::error::Refusing to overwrite a published asset. Cut a new version, or delete"
              echo "::error::that asset deliberately: gh release delete-asset $TAG $asset --repo $RELEASE_REPO"
              exit 1
            fi
            gh release upload "$TAG" "$asset" --repo "$RELEASE_REPO"
            echo "uploaded: $asset"
            uploaded=$((uploaded + 1))
          done

          echo "assets uploaded=$uploaded skipped=$skipped"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$RELEASE_REPO" --draft=false
          echo "published https://github.com/${RELEASE_REPO}/releases/tag/${TAG}"
          gh release view "$TAG" --repo "$RELEASE_REPO" --json assets --jq '.assets[].name'
