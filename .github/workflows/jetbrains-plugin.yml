name: JetBrains Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'editors/jetbrains/**'
      - '.github/workflows/jetbrains-plugin.yml'
  pull_request:
    paths:
      - 'editors/jetbrains/**'
      - '.github/workflows/jetbrains-plugin.yml'

# No Marketplace secrets are required for build/test/verify. Signing and
# publishing are operator stop-points and live outside this workflow.
permissions:
  contents: read

jobs:
  build:
    name: Build, test, verify
    runs-on: ubuntu-latest
    # The plugin verifier downloads IDE distributions; a runaway set filled
    # the runner disk and the job died at ~92min with no step failure. Keep
    # the job bounded so a recurrence fails fast and diagnosably.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: editors/jetbrains
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Free disk space
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune --all --force --volumes 2>/dev/null || true
          df -h /

      # Gradle's foojay resolver auto-provisions the JDK 21 toolchain declared
      # in build.gradle.kts (jvmToolchain(21)); installing 21 directly skips
      # that extra download and keeps this lane aligned with jetbrains-publish.
      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build plugin
        run: ./gradlew buildPlugin --stacktrace

      - name: Verify plugin
        run: ./gradlew verifyPlugin --stacktrace

      - name: Upload plugin artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loctree-intellij-plugin
          path: editors/jetbrains/build/distributions/*.zip
          if-no-files-found: ignore
