# Semgrep Security Scanning
# 𝚅𝚒𝚋𝚎𝚌𝚛𝚊𝚏𝚝𝚎𝚍. with AI Agents by Vetcoders (c)2024-2026 LibraxisAI

name: Semgrep

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest

    steps:
      - name: Allow git in GitHub Actions workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Semgrep
        run: python -m pip install --upgrade pip && pip install semgrep

      # Rule exclusions, each with its reason:
      # - rust.actix.path-traversal.tainted-path: an actix-web rule. Loctree has
      #   no HTTP handler that maps request input to the filesystem; every
      #   flagged site is a CLI command (`loct slice <file>`, cache paths)
      #   taking a path from the operator on argv, which is the tool's job.
      # - html.security.audit.missing-integrity: same exclusion as `make semgrep`
      #   (the local gate); static report templates, no CDN scripts.
      - name: Run Semgrep
        run: >-
          semgrep scan --config auto --config p/rust --config p/typescript
          --exclude-rule rust.actix.path-traversal.tainted-path.tainted-path
          --exclude-rule html.security.audit.missing-integrity.missing-integrity
          --sarif --output semgrep.sarif .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
