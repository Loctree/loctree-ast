name: JetBrains Plugin Publish

# One-button Marketplace publish. Manual trigger ONLY — this workflow can
# never fire on push or pull_request. Dry-run is the default: it proves the
# whole chain (build → verify → sign) without uploading anything.
#
# Required repository secrets (see docs/release/jetbrains-marketplace.md):
#   JETBRAINS_MARKETPLACE_TOKEN   Marketplace permanent token (publish scope)
#   JETBRAINS_CERTIFICATE_CHAIN   PEM certificate chain (chain.crt content)
#   JETBRAINS_PRIVATE_KEY         PEM private key (private.pem content)
#   JETBRAINS_PRIVATE_KEY_PASSWORD  Passphrase for the private key
#
# RUNTIME DELIVERY — download-only by design:
# The published ZIP carries NO loctree-lsp binary. Bundling is a dev-only
# opt-in (`-PbundleLsp=true` / `LOCTREE_BUNDLE_LSP=1`) and is off in every
# default build, so this Linux runner cannot bake an ELF into a ZIP that
# macOS and Windows users install. BinaryResolver falls through to
# cache → SHA256-verified download → PATH, which is fail-closed and
# platform-correct. Nothing here may enable bundling.
# See docs/release/jetbrains-marketplace.md § Runtime delivery.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, verify, and sign but do NOT upload to Marketplace'
        type: boolean
        default: true
      channel:
        description: 'Marketplace channel (stable = the default channel all users see)'
        type: choice
        options:
          - stable
          - eap
        default: stable

permissions:
  contents: read

concurrency:
  group: jetbrains-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Sign & publish (dry_run=${{ inputs.dry_run }}, channel=${{ inputs.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: editors/jetbrains
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Preflight secrets (fail fast, never silently skip)
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERT_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          missing=()
          [ -z "$PUBLISH_TOKEN" ] && missing+=(JETBRAINS_MARKETPLACE_TOKEN)
          [ -z "$CERT_CHAIN" ] && missing+=(JETBRAINS_CERTIFICATE_CHAIN)
          [ -z "$PRIVATE_KEY" ] && missing+=(JETBRAINS_PRIVATE_KEY)
          [ -z "$PRIVATE_KEY_PASSWORD" ] && missing+=(JETBRAINS_PRIVATE_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "A real publish is impossible without them. See docs/release/jetbrains-marketplace.md."
            exit 1
          fi
          echo "All publish secrets present. dry_run=$DRY_RUN"

      # verifyPlugin downloads an IDE distribution; keep the runner disk sane
      # (same mitigation as jetbrains-plugin.yml — a runaway verifier once
      # filled the 14GB disk and killed the job with no step failure).
      - name: Free disk space
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune --all --force --volumes 2>/dev/null || true
          df -h /

      # Gradle's foojay resolver auto-provisions the JDK 21 toolchain declared
      # in build.gradle.kts; installing 21 directly skips that extra download.
      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build plugin
        run: ./gradlew buildPlugin --stacktrace

      - name: Verify plugin
        run: ./gradlew verifyPlugin --stacktrace

      - name: Materialize signing key files
        env:
          CERT_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY_CONTENT: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
        run: |
          umask 077
          # Trailing newline on purpose: a PEM block pasted into the GitHub
          # secrets UI usually arrives without one, and armour parsers are
          # entitled to expect a line terminator after -----END ...-----.
          # An extra blank line at the end of a PEM file is always legal.
          printf '%s\n' "$CERT_CHAIN" > "$RUNNER_TEMP/chain.crt"
          printf '%s\n' "$PRIVATE_KEY_CONTENT" > "$RUNNER_TEMP/private.pem"
          echo "Wrote $RUNNER_TEMP/chain.crt and $RUNNER_TEMP/private.pem"

      # build.gradle.kts reads CERTIFICATE_CHAIN / PRIVATE_KEY as *file paths*.
      - name: Sign plugin
        env:
          CERTIFICATE_CHAIN: ${{ runner.temp }}/chain.crt
          PRIVATE_KEY: ${{ runner.temp }}/private.pem
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin --stacktrace

      # Proof, not trust: a bundled binary must never reach the Marketplace.
      - name: Assert download-only artifact (no bundled loctree-lsp)
        run: |
          set -euo pipefail
          zip_path=$(ls -t build/distributions/*.zip | head -n 1)
          echo "Inspecting $zip_path"
          tmp=$(mktemp -d)
          unzip -q -o "$zip_path" -d "$tmp"
          find "$tmp" -name '*.jar' > "$tmp/jars.txt"
          if [ ! -s "$tmp/jars.txt" ]; then
            echo "::error::No plugin JAR found inside $zip_path — the artifact is not what this job thinks it is."
            exit 1
          fi
          status=0
          while IFS= read -r jar; do
            # No `grep -q`: an early exit would SIGPIPE unzip and, under
            # `pipefail`, turn a real hit into a silent pass.
            if unzip -l "$jar" | grep -E '[[:space:]]bin/loctree-lsp' >/dev/null; then
              echo "::error::$jar bundles a loctree-lsp runtime; this build must stay download-only."
              status=1
            fi
          done < "$tmp/jars.txt"
          [ "$status" -eq 0 ] || exit 1
          echo "::notice::Download-only artifact confirmed — no bin/loctree-lsp in any plugin JAR."

      - name: Publish to JetBrains Marketplace
        if: ${{ !inputs.dry_run }}
        env:
          CERTIFICATE_CHAIN: ${{ runner.temp }}/chain.crt
          PRIVATE_KEY: ${{ runner.temp }}/private.pem
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          PUBLISH_CHANNEL: ${{ inputs.channel == 'stable' && 'default' || inputs.channel }}
        run: ./gradlew publishPlugin --stacktrace

      - name: Dry-run notice
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run complete — plugin built, verified, and signed. Nothing was uploaded."
          echo "Re-run this workflow with dry_run=false to publish for real." >> "$GITHUB_STEP_SUMMARY"

      # `*.zip` already covers the `-signed.zip` that signPlugin emits; listing
      # both would just make v4 report duplicate paths. `if: always()` means
      # this also runs when an earlier step failed, so a missing ZIP must warn
      # rather than `error` — otherwise every early failure reports twice and
      # the second report points at the wrong step.
      - name: Upload signed plugin artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loctree-intellij-plugin-signed
          path: editors/jetbrains/build/distributions/*.zip
          if-no-files-found: warn
