name: Publish Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Legacy thin-repo/crates release tag (vX.Y.Z)"
        required: true
        type: string
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CLI_RELEASE_REPO: Loctree/loct
  MCP_RELEASE_REPO: Loctree/loctree-mcp

jobs:
  verify-release:
    name: Verify Release State
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG}"
          VERSION="${TAG#v}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
          echo "Release version: $VERSION"

      - name: Verify checked-in versions
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          WORKSPACE_VERSION=$(awk '
            /^\[workspace.package\]$/ { in_section=1; next }
            in_section && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          NPM_VERSION=$(node -p "require('./distribution/npm/loct/package.json').version")

          echo "Workspace version: $WORKSPACE_VERSION"
          echo "distribution/npm version: $NPM_VERSION"

          if [[ "$WORKSPACE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Cargo workspace version does not match tag: $WORKSPACE_VERSION != $TAG_VERSION" >&2
            exit 1
          fi

          if [[ "$NPM_VERSION" != "$TAG_VERSION" ]]; then
            echo "distribution/npm version does not match tag: $NPM_VERSION != $TAG_VERSION" >&2
            exit 1
          fi

  verify-npm-contract:
    name: Verify npm publish contract
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Test idempotent npm publish helper
        run: node --test distribution/npm/publish-if-missing.test.mjs

      - name: Confirm trusted-publishing mode
        run: echo "npm publish uses the workflow OIDC identity for every package name"

  publish-crates:
    name: Publish Rust Crates
    needs: verify-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release-src
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          path: release-src

      # Release-control fixes can land after a tag without changing the source
      # being published. Pin them to the exact commit that supplied this
      # workflow instead of assuming the immutable tag already contains them.
      - name: Checkout release control
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/wait-for-crates-io-version.sh
          sparse-checkout-cone-mode: false
          path: release-control

      - name: Install release gate dependencies
        run: |
          missing=()
          command -v protoc >/dev/null 2>&1 || missing+=(protobuf-compiler)
          command -v rg >/dev/null 2>&1 || missing+=(ripgrep)
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Release quality gate
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Publish report-leptos (legacy crate)
        run: |
          cargo publish -p report-leptos 2>&1 || {
            if (cd "$RUNNER_TEMP" && cargo info --registry crates-io "report-leptos@${{ needs.verify-release.outputs.version }}" >/dev/null 2>&1); then
              echo "report-leptos already at ${{ needs.verify-release.outputs.version }}, continuing"
            else
              exit 1
            fi
          }

      - name: Wait for crates.io index
        run: ../release-control/scripts/wait-for-crates-io-version.sh report-leptos "${{ needs.verify-release.outputs.version }}"

      - name: Publish loctree-ast
        run: |
          cargo publish -p loctree-ast 2>&1 || {
            if (cd "$RUNNER_TEMP" && cargo info --registry crates-io "loctree-ast@${{ needs.verify-release.outputs.version }}" >/dev/null 2>&1); then
              echo "loctree-ast already at ${{ needs.verify-release.outputs.version }}, continuing"
            else
              exit 1
            fi
          }

      - name: Wait for crates.io index
        run: ../release-control/scripts/wait-for-crates-io-version.sh loctree-ast "${{ needs.verify-release.outputs.version }}"

      - name: Publish loctree (legacy crate)
        run: |
          cargo publish -p loctree 2>&1 || {
            if (cd "$RUNNER_TEMP" && cargo info --registry crates-io "loctree@${{ needs.verify-release.outputs.version }}" >/dev/null 2>&1); then
              echo "loctree already at ${{ needs.verify-release.outputs.version }}, continuing"
            else
              exit 1
            fi
          }

      - name: Wait for crates.io index
        run: ../release-control/scripts/wait-for-crates-io-version.sh loctree "${{ needs.verify-release.outputs.version }}"

      - name: Publish loctree-mcp (legacy crate)
        run: |
          cargo publish -p loctree-mcp 2>&1 || {
            if (cd "$RUNNER_TEMP" && cargo info --registry crates-io "loctree-mcp@${{ needs.verify-release.outputs.version }}" >/dev/null 2>&1); then
              echo "loctree-mcp already at ${{ needs.verify-release.outputs.version }}, continuing"
            else
              exit 1
            fi
          }

      - name: Wait for crates.io index
        run: ../release-control/scripts/wait-for-crates-io-version.sh loctree-mcp "${{ needs.verify-release.outputs.version }}"

  build-cli-linux:
    name: Build CLI Linux Artifact
    needs: [verify-release, publish-crates]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      # One cargo invocation yields the full suite: package `loctree` carries
      # both the `loct` and `loctree` bins; loctree-mcp and loctree-lsp are the
      # co-process binaries the npm embed model ships alongside them.
      - name: Build release binaries
        run: cargo build -p loctree -p loctree-mcp -p loctree-lsp --release --target x86_64-unknown-linux-gnu

      - name: Package CLI Linux artifact
        run: |
          mkdir -p dist/linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/loct dist/linux-x86_64/loct
          chmod +x dist/linux-x86_64/loct
          tar -czf loct-linux-x86_64.tar.gz -C dist/linux-x86_64 loct

      - name: Upload CLI Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loct-linux-x86_64
          path: loct-linux-x86_64.tar.gz
          if-no-files-found: error

      # npm embed staging source: all four suite binaries for this target,
      # keyed by npm platform dir (x86_64-unknown-linux-gnu -> linux-x64-gnu).
      # The tarball name deliberately does NOT start with "loct-" so the
      # publish-thin-releases prefix filters never pick it up.
      - name: Package npm suite artifact (linux-x64-gnu)
        run: |
          mkdir -p dist/npm-linux-x64-gnu
          for bin in loct loctree loctree-mcp loctree-lsp; do
            cp "target/x86_64-unknown-linux-gnu/release/$bin" "dist/npm-linux-x64-gnu/$bin"
            chmod +x "dist/npm-linux-x64-gnu/$bin"
          done
          tar -czf loctree-suite-npm-linux-x64-gnu.tar.gz -C dist/npm-linux-x64-gnu loct loctree loctree-mcp loctree-lsp

      - name: Upload npm suite artifact (linux-x64-gnu)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-suite-linux-x64-gnu
          path: loctree-suite-npm-linux-x64-gnu.tar.gz
          if-no-files-found: error

  build-cli-macos-arm64:
    name: Build CLI macOS ARM64 Artifact
    needs: [verify-release, publish-crates]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Import macOS signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/loctree-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/loctree-build-cert.p12"
          CA_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$CA_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$CA_PATH" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" /Library/Keychains/System.keychain /System/Library/Keychains/SystemRootCertificates.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Build release binaries
        run: cargo build -p loctree -p loctree-mcp -p loctree-lsp --release --target aarch64-apple-darwin

      - name: Smoke macOS dylib portability
        run: |
          set -euo pipefail
          bin="target/aarch64-apple-darwin/release"
          bash distribution/macos/smoke-releaseability.sh \
            "$bin/loct" "$bin/loctree" "$bin/loctree-mcp" "$bin/loctree-lsp"

      - name: Package CLI macOS ARM64 artifact
        env:
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p dist/darwin-aarch64
          cp target/aarch64-apple-darwin/release/loct dist/darwin-aarch64/loct
          chmod +x dist/darwin-aarch64/loct
          bash distribution/macos/sign-and-notarize.sh dist/darwin-aarch64 loct-darwin-aarch64-notarized.zip
          tar -czf loct-darwin-aarch64.tar.gz -C dist/darwin-aarch64 loct

      - name: Upload CLI macOS ARM64 artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loct-darwin-aarch64
          path: |
            loct-darwin-aarch64.tar.gz
            loct-darwin-aarch64-notarized.zip
          if-no-files-found: error

      # npm embed staging source: all four suite binaries for this target,
      # keyed by npm platform dir (aarch64-apple-darwin -> darwin-arm64),
      # signed and notarized like the thin artifact above.
      - name: Package npm suite artifact (darwin-arm64)
        env:
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p dist/npm-darwin-arm64
          for bin in loct loctree loctree-mcp loctree-lsp; do
            cp "target/aarch64-apple-darwin/release/$bin" "dist/npm-darwin-arm64/$bin"
            chmod +x "dist/npm-darwin-arm64/$bin"
          done
          bash distribution/macos/sign-and-notarize.sh dist/npm-darwin-arm64 loctree-suite-npm-darwin-arm64-notarized.zip
          tar -czf loctree-suite-npm-darwin-arm64.tar.gz -C dist/npm-darwin-arm64 loct loctree loctree-mcp loctree-lsp

      - name: Upload npm suite artifact (darwin-arm64)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-suite-darwin-arm64
          path: loctree-suite-npm-darwin-arm64.tar.gz
          if-no-files-found: error

  build-cli-macos-x86_64:
    name: Build CLI macOS x86_64 Artifact
    needs: [verify-release, publish-crates]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-apple-darwin

      - name: Import macOS signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/loctree-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/loctree-build-cert.p12"
          CA_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$CA_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$CA_PATH" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" /Library/Keychains/System.keychain /System/Library/Keychains/SystemRootCertificates.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Build release binaries
        run: cargo build -p loctree -p loctree-mcp -p loctree-lsp --release --target x86_64-apple-darwin

      - name: Smoke macOS dylib portability
        run: |
          set -euo pipefail
          bin="target/x86_64-apple-darwin/release"
          bash distribution/macos/smoke-releaseability.sh \
            "$bin/loct" "$bin/loctree" "$bin/loctree-mcp" "$bin/loctree-lsp"

      - name: Package CLI macOS x86_64 artifact
        env:
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p dist/darwin-x86_64
          cp target/x86_64-apple-darwin/release/loct dist/darwin-x86_64/loct
          chmod +x dist/darwin-x86_64/loct
          bash distribution/macos/sign-and-notarize.sh dist/darwin-x86_64 loct-darwin-x86_64-notarized.zip
          tar -czf loct-darwin-x86_64.tar.gz -C dist/darwin-x86_64 loct

      - name: Upload CLI macOS x86_64 artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loct-darwin-x86_64
          path: |
            loct-darwin-x86_64.tar.gz
            loct-darwin-x86_64-notarized.zip
          if-no-files-found: error

      # npm embed staging source: all four suite binaries for this target,
      # keyed by npm platform dir (x86_64-apple-darwin -> darwin-x64),
      # signed and notarized like the thin artifact above.
      - name: Package npm suite artifact (darwin-x64)
        env:
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p dist/npm-darwin-x64
          for bin in loct loctree loctree-mcp loctree-lsp; do
            cp "target/x86_64-apple-darwin/release/$bin" "dist/npm-darwin-x64/$bin"
            chmod +x "dist/npm-darwin-x64/$bin"
          done
          bash distribution/macos/sign-and-notarize.sh dist/npm-darwin-x64 loctree-suite-npm-darwin-x64-notarized.zip
          tar -czf loctree-suite-npm-darwin-x64.tar.gz -C dist/npm-darwin-x64 loct loctree loctree-mcp loctree-lsp

      - name: Upload npm suite artifact (darwin-x64)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-suite-darwin-x64
          path: loctree-suite-npm-darwin-x64.tar.gz
          if-no-files-found: error

  build-cli-windows:
    name: Build CLI Windows Artifact
    needs: [verify-release, publish-crates]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binaries
        run: cargo build -p loctree -p loctree-mcp -p loctree-lsp --release --target x86_64-pc-windows-msvc

      - name: Package CLI Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\loct.exe dist\loct.exe
          Compress-Archive -Path dist\* -DestinationPath loct-windows-x86_64.zip -Force

      - name: Upload CLI Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loct-windows-x86_64
          path: loct-windows-x86_64.zip
          if-no-files-found: error

      # npm embed staging source: all four suite binaries for this target,
      # keyed by npm platform dir (x86_64-pc-windows-msvc -> win32-x64-msvc).
      - name: Package npm suite artifact (win32-x64-msvc)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-npm | Out-Null
          foreach ($bin in @('loct', 'loctree', 'loctree-mcp', 'loctree-lsp')) {
            Copy-Item "target\x86_64-pc-windows-msvc\release\$bin.exe" "dist-npm\$bin.exe"
          }
          Compress-Archive -Path dist-npm\* -DestinationPath loctree-suite-npm-win32-x64-msvc.zip -Force

      - name: Upload npm suite artifact (win32-x64-msvc)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-suite-win32-x64-msvc
          path: loctree-suite-npm-win32-x64-msvc.zip
          if-no-files-found: error

  build-mcp-linux:
    name: Build MCP Linux Artifact
    needs: [verify-release, publish-crates]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build -p loctree-mcp --release --target x86_64-unknown-linux-gnu

      - name: Package MCP Linux artifact
        run: |
          mkdir -p dist/linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/loctree-mcp dist/linux-x86_64/loct-mcp
          chmod +x dist/linux-x86_64/loct-mcp
          tar -czf loct-mcp-linux-x86_64.tar.gz -C dist/linux-x86_64 loct-mcp

      - name: Upload MCP Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loct-mcp-linux-x86_64
          path: loct-mcp-linux-x86_64.tar.gz
          if-no-files-found: error

  build-mcp-macos-arm64:
    name: Build MCP macOS ARM64 Artifact
    needs: [verify-release, publish-crates]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Import macOS signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/loctree-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/loctree-build-cert.p12"
          CA_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$CA_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$CA_PATH" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" /Library/Keychains/System.keychain /System/Library/Keychains/SystemRootCertificates.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Build release binary
        run: cargo build -p loctree-mcp --release --target aarch64-apple-darwin

      - name: Smoke macOS dylib portability
        run: |
          set -euo pipefail
          bash distribution/macos/smoke-releaseability.sh \
            target/aarch64-apple-darwin/release/loctree-mcp

      - name: Package MCP macOS ARM64 artifact
        env:
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p dist/darwin-aarch64
          cp target/aarch64-apple-darwin/release/loctree-mcp dist/darwin-aarch64/loct-mcp
          chmod +x dist/darwin-aarch64/loct-mcp
          bash distribution/macos/sign-and-notarize.sh dist/darwin-aarch64 loct-mcp-darwin-aarch64-notarized.zip
          tar -czf loct-mcp-darwin-aarch64.tar.gz -C dist/darwin-aarch64 loct-mcp

      - name: Upload MCP macOS ARM64 artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loct-mcp-darwin-aarch64
          path: |
            loct-mcp-darwin-aarch64.tar.gz
            loct-mcp-darwin-aarch64-notarized.zip
          if-no-files-found: error

  build-mcp-macos-x86_64:
    name: Build MCP macOS x86_64 Artifact
    needs: [verify-release, publish-crates]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-apple-darwin

      - name: Import macOS signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
