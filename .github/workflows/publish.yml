          TARGET_VERSION: ${{ needs.verify-release.outputs.version }}
          RELEASE_NAME: loct-mcp v${{ needs.verify-release.outputs.version }}
          ASSET_PREFIX: loct-mcp-
          ASSET_DIR: release-assets
          RELEASE_BODY: |
            Thin release channel for the active loct-mcp server.

            Source of truth: `Loctree/loctree-suite`
            Install:
            - `brew install loctree/mcp/loct-mcp`
            - `cargo install loctree-mcp` (current crates.io package name)
        with:
          github-token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const [owner, repo] = process.env.TARGET_REPO.split("/");
            const tag = process.env.TARGET_TAG;
            const releaseName = process.env.RELEASE_NAME;
            const releaseBody = process.env.RELEASE_BODY;
            const assetDir = process.env.ASSET_DIR;
            const assetPrefix = process.env.ASSET_PREFIX;
            const files = fs.readdirSync(assetDir).filter((name) => name.startsWith(assetPrefix)).sort();

            if (!files.length) {
              core.setFailed(`No assets found in ${assetDir} with prefix ${assetPrefix}`);
              return;
            }

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.data.id,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
              });
            }

            const releaseId = release.data.id;
            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100,
            });

            for (const fileName of files) {
              const existing = existingAssets.find((asset) => asset.name === fileName);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: existing.id,
                });
              }

              const data = fs.readFileSync(path.join(assetDir, fileName));
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: releaseId,
                name: fileName,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length,
                },
              });
            }

  publish-npm:
    name: Publish npm (single @loctree/loct suite wrapper)
    needs:
      - verify-release
      - build-cli-linux
      - build-cli-macos-arm64
      - build-cli-macos-x86_64
      - build-cli-windows
      - build-mcp-linux
      - build-mcp-macos-arm64
      - build-mcp-macos-x86_64
      - build-mcp-windows
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC). npm mints a short-lived credential from this
    # job's identity instead of a long-lived NPM_TOKEN, so there is no secret to
    # leak and no publisher IP to allowlist — which is what blocked publishing
    # once CI moved off the self-hosted runner. Requires a trusted publisher
    # configured on npmjs.com for every package this job pushes, pointing at
    # this repository and this workflow filename.
    permissions:
      id-token: write
      contents: read
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Node 20 ships npm 10.x; OIDC trusted publishing needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # Gen3 single-wrapper model. Only @loctree/loct is user-facing; its
      # @loctree/loct-* platform packages are a technical delivery mechanism.
      # We do NOT publish @loctree/loctree-mcp or @loctree/loctree-lsp separately.
      - name: Refresh npm package versions (wrapper + 4 platform packages)
        run: node distribution/npm/sync-version.mjs "${{ needs.verify-release.outputs.version }}"

      # Embed model: each @loctree/loct-<platform> package ships the FULL suite
      # (loct, loctree, loctree-mcp, loctree-lsp). Stage the four release binaries
      # into each platform-packages/<plat>/ before publishing.
      #
      # TODO(real-CI): wire this to real build artifacts. The combined release
      # bundle from release-bundles.yml (loctree-<version>-<target>.tar.gz) already
      # carries all four binaries and is the cleanest source. The build-cli-* /
      # build-mcp-* jobs above currently emit single-binary thin tarballs and must
      # be extended to provide all four binaries per platform for embed.
      - name: Stage suite binaries into platform packages (NOT WIRED)
        run: |
          echo "::error::npm embed staging is not wired to real build artifacts."
          echo "Each distribution/npm/loct/platform-packages/<plat>/ must receive:"
          echo "  loct loctree loctree-mcp loctree-lsp   (.exe variants on win32)"
          echo "Source: combined bundle loctree-<version>-<target>.tar.gz (release-bundles.yml)."
          exit 1

      # Fail-closed gate. The staging step above is a stub, so without this the
      # publish steps below would push @loctree/loct-<platform> packages that
      # contain no binaries at all — a broken `npm i -g @loctree/loct` for every
      # user, and npm versions are immutable so it could not be taken back.
      # Verify every platform package actually carries its four executables
      # before anything is published.
      - name: Verify platform packages carry the suite binaries
        working-directory: distribution/npm/loct
        run: |
          set -euo pipefail
          missing=0
          for plat_dir in platform-packages/*/; do
            plat="$(basename "$plat_dir")"
            case "$plat" in
              *win32*) ext=".exe" ;;
              *)       ext=""     ;;
            esac
            for bin in loct loctree loctree-mcp loctree-lsp; do
              target="${plat_dir}bin/${bin}${ext}"
              if [[ ! -s "$target" ]]; then
                echo "::error::${plat}: missing or empty ${bin}${ext} (expected at ${target})"
                missing=1
              fi
            done
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Refusing to publish npm platform packages without staged binaries."
            exit 1
          fi
          echo "All platform packages carry loct, loctree, loctree-mcp, loctree-lsp."

      - name: Publish npm platform packages (technical, full-suite embed)
        working-directory: distribution/npm/loct
        run: |
          for plat_dir in platform-packages/*/; do
            (cd "$plat_dir" && npm publish --access public)
          done
          sleep 20

      # The wrapper ships under two names from ONE source directory — same
      # tarball, same version, no duplicated resolver. `loctree` is the plain
      # name users reach for (`npm i -g loctree`); `@loctree/loct` stays
      # published because it is the install path printed in the README, the
      # CHANGELOG and every published doc so far. Both must have a trusted
      # publisher configured on npmjs.com.
      - name: Publish the user-facing wrapper (@loctree/loct, then loctree)
        working-directory: distribution/npm/loct
        run: |
          set -euo pipefail
          npm publish --access public

          npm pkg set name=loctree
          npm publish --access public
          git checkout -- package.json

  publish-monorepo-release:
    name: Publish Monorepo Release
    needs:
      - verify-release
      - publish-crates
      - publish-thin-releases
      - publish-npm
    runs-on: ubuntu-latest
    steps:
      - name: Create monorepo release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ needs.verify-release.outputs.tag }}
          name: loctree-suite ${{ needs.verify-release.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## loctree-suite v${{ needs.verify-release.outputs.version }}

            Monorepo release for source, changelog, and publish orchestration.

            User-facing binary channels:
            - CLI assets: https://github.com/${{ env.CLI_RELEASE_REPO }}/releases/tag/v${{ needs.verify-release.outputs.version }}
            - MCP assets: https://github.com/${{ env.MCP_RELEASE_REPO }}/releases/tag/v${{ needs.verify-release.outputs.version }}

            Installation:

            Current crates.io package names remain on the legacy line:

            ```bash
            cargo install loctree loctree-mcp
            npm install -g @loctree/loct
            brew install loctree/cli/loct
            brew install loctree/mcp/loct-mcp
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
