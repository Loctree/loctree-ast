          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$CA_PATH" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" /Library/Keychains/System.keychain /System/Library/Keychains/SystemRootCertificates.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Build release binary
        run: cargo build -p loctree-mcp --release --target x86_64-apple-darwin

      - name: Smoke macOS dylib portability
        run: |
          set -euo pipefail
          bash distribution/macos/smoke-releaseability.sh \
            target/x86_64-apple-darwin/release/loctree-mcp

      - name: Package MCP macOS x86_64 artifact
        env:
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p dist/darwin-x86_64
          cp target/x86_64-apple-darwin/release/loctree-mcp dist/darwin-x86_64/loct-mcp
          chmod +x dist/darwin-x86_64/loct-mcp
          bash distribution/macos/sign-and-notarize.sh dist/darwin-x86_64 loct-mcp-darwin-x86_64-notarized.zip
          tar -czf loct-mcp-darwin-x86_64.tar.gz -C dist/darwin-x86_64 loct-mcp

      - name: Upload MCP macOS x86_64 artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loct-mcp-darwin-x86_64
          path: |
            loct-mcp-darwin-x86_64.tar.gz
            loct-mcp-darwin-x86_64-notarized.zip
          if-no-files-found: error

  build-mcp-windows:
    name: Build MCP Windows Artifact
    needs: [verify-release, publish-crates]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build -p loctree-mcp --release --target x86_64-pc-windows-msvc

      - name: Package MCP Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\loctree-mcp.exe dist\loct-mcp.exe
          Compress-Archive -Path dist\* -DestinationPath loct-mcp-windows-x86_64.zip -Force

      - name: Upload MCP Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loct-mcp-windows-x86_64
          path: loct-mcp-windows-x86_64.zip
          if-no-files-found: error

  publish-thin-releases:
    name: Publish Thin Repo Releases
    needs:
      - verify-release
      - build-cli-linux
      - build-cli-macos-arm64
      - build-cli-macos-x86_64
      - build-cli-windows
      - build-mcp-linux
      - build-mcp-macos-arm64
      - build-mcp-macos-x86_64
      - build-mcp-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show packaged assets
        run: ls -lah release-assets

      - name: Publish CLI thin release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_REPO: ${{ env.CLI_RELEASE_REPO }}
          TARGET_TAG: v${{ needs.verify-release.outputs.version }}
          TARGET_VERSION: ${{ needs.verify-release.outputs.version }}
          RELEASE_NAME: loct v${{ needs.verify-release.outputs.version }}
          ASSET_PREFIX: loct-
          ASSET_DIR: release-assets
          RELEASE_BODY: |
            Thin release channel for the active loct CLI.

            Source of truth: `Loctree/loctree-suite`
            Install:
            - `brew install loctree/cli/loct`
            - `cargo install loctree` (current crates.io package name)
            - `npm install -g @loctree/loctree` (installs loct, loctree, loctree-mcp, loctree-lsp)
        with:
          github-token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const [owner, repo] = process.env.TARGET_REPO.split("/");
            const tag = process.env.TARGET_TAG;
            const releaseName = process.env.RELEASE_NAME;
            const releaseBody = process.env.RELEASE_BODY;
            const assetDir = process.env.ASSET_DIR;
            const assetPrefix = process.env.ASSET_PREFIX;
            const files = fs.readdirSync(assetDir).filter((name) => name.startsWith(assetPrefix)).sort();

            if (!files.length) {
              core.setFailed(`No assets found in ${assetDir} with prefix ${assetPrefix}`);
              return;
            }

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.data.id,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
              });
            }

            const releaseId = release.data.id;
            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100,
            });

            for (const fileName of files) {
              const existing = existingAssets.find((asset) => asset.name === fileName);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: existing.id,
                });
              }

              const data = fs.readFileSync(path.join(assetDir, fileName));
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: releaseId,
                name: fileName,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length,
                },
              });
            }

      - name: Publish MCP thin release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_REPO: ${{ env.MCP_RELEASE_REPO }}
          TARGET_TAG: v${{ needs.verify-release.outputs.version }}
          TARGET_VERSION: ${{ needs.verify-release.outputs.version }}
          RELEASE_NAME: loct-mcp v${{ needs.verify-release.outputs.version }}
          ASSET_PREFIX: loct-mcp-
          ASSET_DIR: release-assets
          RELEASE_BODY: |
            Thin release channel for the active loct-mcp server.

            Source of truth: `Loctree/loctree-suite`
            Install:
            - `brew install loctree/mcp/loct-mcp`
            - `cargo install loctree-mcp` (current crates.io package name)
        with:
          github-token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const [owner, repo] = process.env.TARGET_REPO.split("/");
            const tag = process.env.TARGET_TAG;
            const releaseName = process.env.RELEASE_NAME;
            const releaseBody = process.env.RELEASE_BODY;
            const assetDir = process.env.ASSET_DIR;
            const assetPrefix = process.env.ASSET_PREFIX;
            const files = fs.readdirSync(assetDir).filter((name) => name.startsWith(assetPrefix)).sort();

            if (!files.length) {
              core.setFailed(`No assets found in ${assetDir} with prefix ${assetPrefix}`);
              return;
            }

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.data.id,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
              });
            }

            const releaseId = release.data.id;
            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100,
            });

            for (const fileName of files) {
              const existing = existingAssets.find((asset) => asset.name === fileName);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: existing.id,
                });
              }

              const data = fs.readFileSync(path.join(assetDir, fileName));
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: releaseId,
                name: fileName,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length,
                },
              });
            }

  publish-npm:
    name: Publish npm (one wrapper, three identities)
    needs:
      - verify-release
      - build-cli-linux
      - build-cli-macos-arm64
      - build-cli-macos-x86_64
      - build-cli-windows
      - build-mcp-linux
      - build-mcp-macos-arm64
      - build-mcp-macos-x86_64
      - build-mcp-windows
      - verify-npm-contract
    runs-on: ubuntu-latest
    # Steady state uses trusted publishing (OIDC) exclusively. The one-time
    # 0.14.4 bootstrap is an operator-owned local Make target; no long-lived npm
    # credential remains in this workflow after the package identities exist.
    permissions:
      id-token: write
      contents: read
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Node 20 ships npm 10.x; OIDC trusted publishing needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # Gen3 single-wrapper model. @loctree/loctree is canonical, while
      # @loctree/loct and loctree remain maintained aliases. The four
      # @loctree/loctree-* packages are a technical delivery mechanism.
      # We do NOT publish @loctree/loctree-mcp or @loctree/loctree-lsp separately.
      - name: Refresh npm package versions (wrapper + 4 platform packages)
        run: node distribution/npm/sync-version.mjs "${{ needs.verify-release.outputs.version }}"

      # Embed model: each @loctree/loctree-<platform> package ships the FULL suite
      # (loct, loctree, loctree-mcp, loctree-lsp) under bin/. The build-cli-*
      # jobs above build all four binaries per target and upload one
      # npm-suite-<plat> artifact each, already keyed by npm platform dir:
      #   x86_64-unknown-linux-gnu -> linux-x64-gnu
      #   aarch64-apple-darwin     -> darwin-arm64
      #   x86_64-apple-darwin      -> darwin-x64
      #   x86_64-pc-windows-msvc   -> win32-x64-msvc
      - name: Download npm suite artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: npm-suite-*
          path: npm-suite-artifacts
          merge-multiple: true

      - name: Stage suite binaries into platform packages
        run: |
          set -euo pipefail
          ls -lah npm-suite-artifacts

          stage_unix() {
            plat="$1"
            tarball="npm-suite-artifacts/loctree-suite-npm-${plat}.tar.gz"
            dest="distribution/npm/loct/platform-packages/${plat}/bin"
            mkdir -p "$dest"
            tar -xzf "$tarball" -C "$dest"
            for bin in loct loctree loctree-mcp loctree-lsp; do
              chmod +x "${dest}/${bin}"
            done
          }

          stage_unix linux-x64-gnu
          stage_unix darwin-arm64
          stage_unix darwin-x64

          dest="distribution/npm/loct/platform-packages/win32-x64-msvc/bin"
          mkdir -p "$dest"
          unzip -o npm-suite-artifacts/loctree-suite-npm-win32-x64-msvc.zip -d "$dest"

          ls -lah distribution/npm/loct/platform-packages/*/bin/

      # Fail-closed gate. Without this the publish steps below could push
      # @loctree/loctree-<platform> packages that carry missing or truncated
      # binaries — a broken `npm i -g @loctree/loctree` for every user, and npm
      # versions are immutable so it could not be taken back. Verify every
      # platform package actually carries its four executables — present,
      # non-trivially sized, and executable on unix — before anything is
      # published.
      - name: Verify platform packages carry the suite binaries
        working-directory: distribution/npm/loct
        run: |
          set -euo pipefail
          min_size=1048576
          missing=0
          for plat_dir in platform-packages/*/; do
            plat="$(basename "$plat_dir")"
            case "$plat" in
              *win32*) ext=".exe" ;;
              *)       ext=""     ;;
            esac
            for bin in loct loctree loctree-mcp loctree-lsp; do
              target="${plat_dir}bin/${bin}${ext}"
              if [[ ! -s "$target" ]]; then
                echo "::error::${plat}: missing or empty ${bin}${ext} (expected at ${target})"
                missing=1
                continue
              fi
              size=$(stat -c '%s' "$target")
              if [[ "$size" -lt "$min_size" ]]; then
                echo "::error::${plat}: ${bin}${ext} is suspiciously small (${size} bytes < ${min_size})"
                missing=1
              fi
              if [[ -z "$ext" && ! -x "$target" ]]; then
                echo "::error::${plat}: ${bin} is not executable"
                missing=1
              fi
            done
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Refusing to publish npm platform packages without staged binaries."
            exit 1
          fi
          echo "All platform packages carry executable loct, loctree, loctree-mcp, loctree-lsp."

      - name: Publish npm platform packages (trusted OIDC)
        working-directory: distribution/npm/loct
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          set -euo pipefail
          for plat_dir in platform-packages/*/; do
            node ../publish-if-missing.mjs --package-dir "$plat_dir" --version "$RELEASE_VERSION"
          done
          sleep 20

      # One wrapper source ships under three durable identities. The scoped
      # `@loctree/loct` address remains a maintained alias; it is not frozen or
      # deprecated merely because `@loctree/loctree` is canonical.
      - name: Publish the user-facing wrapper aliases with trusted OIDC
        working-directory: distribution/npm/loct
        env:
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          set -euo pipefail
          node ../publish-if-missing.mjs --package-dir . --version "$RELEASE_VERSION"

          npm pkg set name=@loctree/loct
          node ../publish-if-missing.mjs --package-dir . --version "$RELEASE_VERSION"

          npm pkg set name=loctree
          node ../publish-if-missing.mjs --package-dir . --version "$RELEASE_VERSION"
          npm pkg set name=@loctree/loctree

  publish-monorepo-release:
    name: Publish Monorepo Release
    needs:
      - verify-release
      - publish-crates
      - publish-thin-releases
      - publish-npm
    runs-on: ubuntu-latest
    steps:
      - name: Create monorepo release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ needs.verify-release.outputs.tag }}
          name: loctree-suite ${{ needs.verify-release.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## loctree-suite v${{ needs.verify-release.outputs.version }}

            Monorepo release for source, changelog, and publish orchestration.

            User-facing binary channels:
            - CLI assets: https://github.com/${{ env.CLI_RELEASE_REPO }}/releases/tag/v${{ needs.verify-release.outputs.version }}
            - MCP assets: https://github.com/${{ env.MCP_RELEASE_REPO }}/releases/tag/v${{ needs.verify-release.outputs.version }}

            Installation:

            Current crates.io package names remain on the legacy line:

            ```bash
            cargo install loctree loctree-mcp
            npm install -g @loctree/loctree
            brew install loctree/cli/loct
            brew install loctree/mcp/loct-mcp
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
