name: ci

on:
  push:
    branches: [ main, develop, feat/substrate-scaffold ]
  # Internal stacked pull requests need the same gate as long-lived branches.
  # The job-level guard below keeps fork code off this workflow entirely; it
  # predates the move to hosted runners and is kept as defence in depth.
  pull_request: {}

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          # SECURITY HOLD (2026-07-30, resolved 2026-08-13): ops-linux was not
          # trusted pending a verified host rebuild. Both lanes now run on
          # ephemeral GitHub-hosted runners, so no self-hosted host is trusted
          # with repository code at all. `tests/preflight_contract.sh` fences
          # this: it refuses any `self-hosted` label reappearing here.
          - name: linux-hosted
            runner: ubuntu-latest
          - name: macos-hosted
            runner: macos-latest
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune --all --force --volumes 2>/dev/null || true
          sudo apt-get clean
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler ripgrep

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf ripgrep

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy

      - name: Rust fmt
        run: cargo fmt --all -- --check
      - name: Git hook and preflight contracts
        run: make test-git-hooks
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rg-vs-loct scorecard gate
        run: cargo test -p loctree --test scorecard_rg_parity -- scorecard
      - name: rg-vs-loct scorecard report
        run: bash scripts/scorecard.sh --runs 1 --output scorecard.json
      - name: Rust tests
        if: runner.os != 'Linux'
        run: cargo test --workspace
      - name: Rust tests (Linux, bounded)
        if: runner.os == 'Linux'
        # Bound build parallelism and drop test debuginfo so the workspace stays
        # inside the hosted runner's disk and linker-memory budget.
        env:
          CARGO_BUILD_JOBS: "4"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          free -m || true
          df -h / || true
          cargo test --workspace
